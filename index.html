<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Aakib 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
      color: white;
      text-align: center;
    }

    /* =========================
       OPEN SCREEN
    ========================== */

    #openScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
      transition: opacity 1s ease, visibility 1s ease;
    }

    .open-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 30px;
    }

    .gift {
      font-size: 90px;
      animation: giftBounce 1.5s infinite;
    }

    .open-title {
      font-size: clamp(40px, 12vw, 70px);
      font-weight: 800;
      text-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .open-button {
      border: none;
      padding: 18px 55px;
      border-radius: 50px;
      background: white;
      color: #e0527b;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: 0.3s;
    }

    .open-button:hover {
      transform: scale(1.08);
    }

    .open-button:active {
      transform: scale(0.95);
    }

    #openScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================
       BIRTHDAY PAGE
    ========================== */

    #birthdayPage {
      min-height: 100vh;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 30px 0;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 1s ease, transform 1s ease;
    }

    #birthdayPage.show {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .container {
      width: 92%;
      max-width: 650px;
      padding: 40px 25px;
      position: relative;
      z-index: 2;
    }

    .card {
      padding: 45px 25px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      animation: float 4s ease-in-out infinite;
    }

    .cake {
      font-size: 70px;
      animation: bounce 1.5s infinite;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(42px, 12vw, 80px);
      margin-bottom: 5px;
      text-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .name {
      font-size: clamp(45px, 14vw, 90px);
      font-weight: 800;
      background: linear-gradient(90deg, #fff, #ffe082, #fff);
      background-size: 200% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shine 3s linear infinite;
    }

    .message {
      margin: 25px auto;
      max-width: 500px;
      font-size: 18px;
      line-height: 1.7;
    }

    .button {
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      background: white;
      color: #d94f70;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.08);
    }

    /* =========================
       FROM EDDIE PAGE
    ========================== */

    #eddiePage {
      display: none;
      min-height: 100vh;
      width: 100%;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
      animation: pageIn 1s ease;
    }

    #eddiePage.show {
      display: flex;
    }

    .eddie-card {
      width: 95%;
      max-width: 600px;
      padding: 35px 20px;
      border-radius: 30px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .eddie-title {
      font-size: clamp(45px, 13vw, 75px);
      font-weight: 800;
      margin-bottom: 25px;
      text-shadow: 0 5px 20px rgba(0,0,0,0.25);
    }

    .eddie-image {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      margin: 0 auto;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    /* =========================
       CONFETTI
    ========================== */

    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 50;
      animation: fall linear forwards;
      pointer-events: none;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes giftBounce {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 480px) {

      .card {
        padding: 35px 18px;
      }

      .message {
        font-size: 16px;
      }

      .cake {
        font-size: 55px;
      }

      .gift {
        font-size: 75px;
      }

      .open-button {
        padding: 16px 45px;
        font-size: 20px;
      }

      .eddie-card {
        padding: 30px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       FIRST PAGE
  ========================== -->

  <div id="openScreen">

    <div class="open-content">

      <div class="gift">🎁</div>

      <div class="open-title">
        A Surprise For You
      </div>

      <button class="open-button" onclick="openBirthday()">
        Open
      </button>

    </div>

  </div>


  <!-- =========================
       SECOND PAGE
       HAPPY BIRTHDAY AAKIB
  ========================== -->

  <div id="birthdayPage">

    <div class="container">

      <div class="card">

        <div class="cake">🎂</div>

        <h1>Happy Birthday</h1>

        <div class="name">Aakib</div>

        <p class="message">
          Wishing you a day filled with happiness, laughter,
          beautiful memories and lots of wonderful surprises! 💖
          <br><br>
          May this new year of your life be absolutely amazing. ✨
        </p>

        <button class="button" onclick="openEddiePage()">
          🎁 Open Your Surprise
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       THIRD PAGE
       FROM EDDIE
  ========================== -->

  <div id="eddiePage">

    <div class="eddie-card">

      <div class="eddie-title">
        From Eddie
      </div>

      <!-- Eddie picture -->

      <img
        src="eddie.jpg"
        alt="From Eddie"
        class="eddie-image"
      >

    </div>

  </div>


  <script>

    const colors = [
      "#ff4f81",
      "#ffd166",
      "#06d6a0",
      "#118ab2",
      "#ffffff",
      "#c77dff"
    ];


    /* =========================
       CONFETTI
    ========================== */

    function createConfetti() {

      const confetti = document.createElement("div");

      confetti.classList.add("confetti");

      confetti.style.left =
        Math.random() * 100 + "vw";

      confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

      confetti.style.width =
        (Math.random() * 8 + 6) + "px";

      confetti.style.height =
        (Math.random() * 12 + 8) + "px";

      confetti.style.animationDuration =
        (Math.random() * 3 + 3) + "s";

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 7000);
    }


    /* =========================
       FIRST OPEN BUTTON
    ========================== */

    function openBirthday() {

      const openScreen =
        document.getElementById("openScreen");

      const birthdayPage =
        document.getElementById("birthdayPage");

      openScreen.classList.add("hide");

      setTimeout(() => {
        birthdayPage.classList.add("show");
      }, 300);

      for (let i = 0; i < 150; i++) {

        setTimeout(() => {
          createConfetti();
        }, i * 15);

      }
    }


    /* =========================
       NORMAL CONFETTI
    ========================== */

    setInterval(() => {

      const birthdayPage =
        document.getElementById("birthdayPage");

      const eddiePage =
        document.getElementById("eddiePage");

      if (
        birthdayPage.classList.contains("show") ||
        eddiePage.classList.contains("show")
      ) {
        createConfetti();
      }

    }, 150);


    /* =========================
       OPEN YOUR SURPRISE
       → THIRD PAGE
    ========================== */

    function openEddiePage() {

      const birthdayPage =
        document.getElementById("birthdayPage");

      const eddiePage =
        document.getElementById("eddiePage");

      birthdayPage.classList.remove("show");

      setTimeout(() => {

        birthdayPage.style.display = "none";

        eddiePage.classList.add("show");

        for (let i = 0; i < 150; i++) {

          setTimeout(() => {
            createConfetti();
          }, i * 12);

        }

      }, 500);

    }

  </script>

</body>
</html>
